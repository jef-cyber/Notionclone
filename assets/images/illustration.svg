<svg xmlns="http://www.w3.org/2000/svg" width="460" height="400" viewBox="0 0 460 400" fill="none">
  <!-- page background -->
  <rect x="0" y="0" width="460" height="400" rx="20" fill="#ffffff"/>

  <!-- main "document" card -->
  <rect x="36" y="34" width="288" height="316" rx="12" fill="#fbfbfa" stroke="#e6e5e2" stroke-width="1.5"/>
  <!-- sidebar bar on the card -->
  <rect x="36" y="34" width="64" height="316" rx="12" fill="#f2f1ee"/>
  <rect x="36" y="34" width="64" height="46" rx="12" fill="#e9e8e4"/>
  <rect x="48" y="52" width="24" height="10" rx="3" fill="#b9b7b1"/>
  <rect x="52" y="86" width="30" height="6" rx="3" fill="#c9c7c1"/>
  <rect x="52" y="104" width="30" height="6" rx="3" fill="#c9c7c1"/>
  <rect x="52" y="122" width="22" height="6" rx="3" fill="#c9c7c1"/>
  <rect x="52" y="140" width="30" height="6" rx="3" fill="#c9c7c1"/>
  <rect x="52" y="158" width="26" height="6" rx="3" fill="#c9c7c1"/>
  <rect x="52" y="176" width="30" height="6" rx="3" fill="#c9c7c1"/>

  <!-- document content -->
  <rect x="124" y="66" width="150" height="14" rx="7" fill="#d6d4ce"/>
  <rect x="124" y="100" width="176" height="8" rx="4" fill="#e2e1dd"/>
  <rect x="124" y="118" width="160" height="8" rx="4" fill="#e2e1dd"/>
  <rect x="124" y="152" width="120" height="10" rx="5" fill="#b7b4ad"/>
  <rect x="124" y="184" width="176" height="8" rx="4" fill="#e2e1dd"/>
  <rect x="124" y="202" width="150" height="8" rx="4" fill="#e2e1dd"/>
  <rect x="124" y="220" width="120" height="8" rx="4" fill="#e2e1dd"/>

  <!-- checklist rows -->
  <rect x="124" y="252" width="18" height="18" rx="5" fill="#7c6cf0" opacity="0.9"/>
  <rect x="152" y="258" width="130" height="7" rx="3.5" fill="#e2e1dd"/>
  <rect x="124" y="284" width="18" height="18" rx="5" stroke="#b9b7b1" stroke-width="1.8"/>
  <rect x="152" y="290" width="150" height="7" rx="3.5" fill="#e2e1dd"/>

  <!-- floating note card -->
  <g transform="rotate(-3 360 120)">
    <rect x="300" y="92" width="124" height="96" rx="10" fill="#ffffff" stroke="#e6e5e2" stroke-width="1.5" style="filter: drop-shadow(0 10px 24px rgba(30,30,60,0.14))"/>
    <rect x="316" y="112" width="70" height="8" rx="4" fill="#cfcdf0"/>
    <rect x="316" y="132" width="92" height="6" rx="3" fill="#e7e6f2"/>
    <rect x="316" y="146" width="80" height="6" rx="3" fill="#e7e6f2"/>
    <circle cx="326" cy="168" r="7" fill="#8f7cff"/>
    <circle cx="344" cy="168" r="7" fill="#9fb4ff"/>
    <circle cx="362" cy="168" r="7" fill="#c7d3ff"/>
  </g>

  <!-- floating task chip -->
  <g transform="rotate(3 120 330)">
    <rect x="52" y="300" width="150" height="44" rx="10" fill="#ffffff" stroke="#e6e5e2" stroke-width="1.5" style="filter: drop-shadow(0 10px 24px rgba(30,30,60,0.12))"/>
    <circle cx="72" cy="322" r="10" fill="#eef1ff"/>
    <rect x="92" y="314" width="84" height="7" rx="3.5" fill="#d6d4ce"/>
    <rect x="92" y="327" width="56" height="6" rx="3" fill="#e7e6e2"/>
  </g>

  <!-- floating calendar tile -->
  <g transform="rotate(-4 300 330)">
    <rect x="270" y="300" width="76" height="76" rx="12" fill="#ffffff" stroke="#e6e5e2" stroke-width="1.5" style="filter: drop-shadow(0 10px 24px rgba(30,30,60,0.12))"/>
    <rect x="270" y="300" width="76" height="20" rx="12" fill="#4b8bff"/>
    <rect x="280" y="330" width="30" height="7" rx="3.5" fill="#c9c7c1"/>
    <rect x="280" y="346" width="46" height="7" rx="3.5" fill="#e2e1dd"/>
    <rect x="316" y="308" width="18" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- sparkles -->
  <path d="M424 60l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffd166"/>
  <circle cx="430" cy="330" r="7" fill="#8f7cff" opacity="0.85"/>
  <circle cx="30" cy="60" r="5" fill="#4b8bff" opacity="0.8"/>
</svg>
